name: build

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yaml'
  pull_request:
    paths:
      - 'public/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build.yaml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # NOTE: pin every action to a commit SHA before relying on this workflow;
      # Dependabot then keeps the SHAs updated.
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/links
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          # Dual-arch: amd64 native + arm64 via QEMU emulation (setup-qemu-action
          # above) -- the build itself is trivial (static files into a stock
          # nginx image, no compilation), so emulation cost is negligible.
          # Provenance is left on (default), so a multi-platform push produces
          # more GHCR versions than a single-arch one: 1 image index + 1 image
          # manifest per platform + 1 provenance attestation per platform (~5
          # versions/build here). See cleanup.yaml for the retention count.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

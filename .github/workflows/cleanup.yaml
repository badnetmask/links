name: cleanup

# Prune old GHCR image versions so only the current image and one previous
# (a rollback backup) remain. Runs after a successful build; can also be run
# manually from the Actions tab.
#
# The image is dual-arch (amd64 + arm64) with provenance left on, so each build
# produces ~5 GHCR versions (1 image index + 1 image manifest per platform + 1
# provenance attestation per platform). We keep 16 so the current image AND a
# full previous build survive intact, with headroom. The official action counts
# manifests and can't protect a tagged image's children, which is why the count
# is generous rather than an exact 2x multiple.

on:
  workflow_run:
    workflows: [build]
    types: [completed]
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: links
          package-type: container
          min-versions-to-keep: 16
